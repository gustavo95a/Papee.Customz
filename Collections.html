
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jewelry Collection – Neumorphic Black Velvet</title>

<style>
    /* ---------- GLOBAL STYLE ---------- */
    body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: #0d0d0d;
        color: #fff;
        display: flex;
        justify-content: center;
        padding: 40px;
    }

    h1 {
        text-align: center;
        font-weight: 300;
        margin-bottom: 40px;
        letter-spacing: 2px;
    }

    /* ---------- GRID LAYOUT ---------- */
    .gallery {
        max-width: 1200px;
        width: 100%;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 40px;
    }

    /* ---------- NEUMORPHIC CARD ---------- */
    .card {
        background: #0d0d0d;
        padding: 40px;
        border-radius: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.3s ease-in-out;

        /* Soft neumorphic shadow */
        box-shadow:
            20px 20px 40px rgba(0,0,0,0.75),
            -10px -10px 30px rgba(40,40,40,0.2);
    }

    .card:hover {
        transform: translateY(-6px);
        box-shadow:
            25px 25px 50px rgba(0,0,0,0.85),
            -10px -10px 30px rgba(40,40,40,0.25);
    }

    /* ---------- IMAGES ---------- */
    .card img {
        width: 100%;
        max-width: 220px;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 0 6px rgba(255,255,255,0.1));
    }
</style>

</head>
<body>

<div>
    <h1>Luxury Jewelry Collection</h1>

    <div class="gallery">

        <div class="card">
            <img src="YOUR-IMAGE-URL-1.png"div>

        <div class="card">
            <img src="YOUR-IMAGE-URL-2.png" alt="Gold Hoopdiv class="card">
            <img src="YOUR-IMAGE-URL-3.png" alt="Five-St <div class="card">
            <img src="YOUR-IMAGE-URL-4.png" alt="Pear</div>
</div>
<a href="index.html">Home</a>
</body>
</html>
